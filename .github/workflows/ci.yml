name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate distributions
        run: |
          python -m pip install build twine pytest respx
          python -m build --outdir release-dist
          python -m twine check --strict release-dist/*
          python scripts/check_dist.py release-dist
      - name: Test the installed wheel
        run: |
          python -m pip install release-dist/*.whl
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" -q
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: release-dist/*
          if-no-files-found: error

  publish:
    # Publishes to PyPI via Trusted Publishing (OIDC) — no API token needed.
    # One-time setup: on pypi.org, add this repo as a "Trusted Publisher"
    # for the "zelnum" project (workflow file: ci.yml, environment: pypi).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
