[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zelnum"
version = "0.1.1"
description = "Official Python SDK for the Zelnum phone & email verification API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zelnum", email = "support@zelnum.com" }]
keywords = [
    "phone-verification",
    "phone-number-lookup",
    "email-verification",
    "whatsapp-check",
    "lead-validation",
    "data-enrichment",
    "fraud-prevention",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24.0"]

[project.urls]
Homepage = "https://zelnum.com"
Pricing = "https://zelnum.com/pricing/"
Documentation = "https://docs.zelnum.com"
Repository = "https://github.com/Zelnum/zelnum-python"
Changelog = "https://github.com/Zelnum/zelnum-python/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/Zelnum/zelnum-python/issues"

[project.scripts]
zelnum = "zelnum.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "respx>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/zelnum"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "scripts/", ".github/", "README.md", "RELEASING.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
